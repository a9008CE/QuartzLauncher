<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星落官方服务器 - 星落 LaunCher</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v=15">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body{display:block;min-height:100vh}
    .sidebar{display:none}
    .main-content{margin-left:0;padding:0}
    @media(max-width:768px){.main-content{margin-left:0;padding:0}}
    body{display:flex;min-height:100vh}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:24px;background:rgba(8,11,16,.92);backdrop-filter:blur(20px);border-right:1px solid rgba(113,229,220,.08);padding:0;display:flex;flex-direction:column;z-index:100;transition:width .25s ease,padding .25s ease;overflow:hidden}
    .sidebar:hover{width:220px;padding:24px 16px}
    .sidebar .brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:flex-start}
    .sidebar .brand-icon{width:32px;height:32px;color:#71e5dc;flex-shrink:0}
    .sidebar:not(:hover) .brand{position:absolute;top:50%;left:50%;margin:0;transform:translate(-50%,-50%)}
    .sidebar:not(:hover) .brand-icon{width:8px;height:8px;transform:none}
    .sidebar:not(:hover) .brand-text,
    .sidebar:not(:hover) .sidebar-nav,
    .sidebar:not(:hover) .sidebar-bottom{display:none}
    .sidebar .brand-text{white-space:nowrap;opacity:0;transition:opacity .2s ease}
    .sidebar:hover .brand-text{opacity:1}
    .sidebar .brand-text strong{font-size:16px}
    .sidebar .brand-text small{display:block;font-size:9px;color:#5a636b;letter-spacing:2px}
    .sidebar-nav{display:flex;flex-direction:column;gap:4px;margin-bottom:auto}
    .sidebar-nav a{display:flex;align-items:center;gap:10px;font-size:13px;color:#8a939c;padding:10px 12px;border-radius:6px;border:1px solid transparent;transition:all .2s;justify-content:center}
    .sidebar:hover .sidebar-nav a{justify-content:flex-start}
    .sidebar-nav a:hover{color:#71e5dc;background:rgba(113,229,220,.06);border-color:rgba(113,229,220,.1)}
    .sidebar-nav a.active{color:#71e5dc;background:rgba(113,229,220,.08);border-color:rgba(113,229,220,.12)}
    .sidebar-nav svg{width:16px;height:16px;flex-shrink:0}
    .sidebar-nav span{white-space:nowrap;opacity:0;transition:opacity .2s ease}
    .sidebar:hover .sidebar-nav span{opacity:1}
    .sidebar-bottom{display:flex;flex-direction:column;gap:8px}
    .sidebar-bottom .theme-toggle{width:100%;justify-content:center;padding:8px}
    .main-content{margin-left:0;flex:1;padding:0}
    @media(max-width:768px){
      .sidebar{width:24px;padding:0}
      .main-content{margin-left:24px;padding:24px 16px}
    }
    html.light .sidebar{background:rgba(226,232,240,.92);border-right-color:rgba(0,0,0,.05)}
    html.light .sidebar-nav a{color:#64748b}
    html.light .sidebar-nav a:hover{color:#0a7e6e;background:rgba(10,126,110,.05);border-color:rgba(10,126,110,.1)}
    html.light .sidebar-nav a.active{color:#0a7e6e;background:rgba(10,126,110,.06);border-color:rgba(10,126,110,.1)}
    body{display:block;min-height:100vh}
    .sidebar{display:none}
    .main-content{max-width:1000px;margin:0 auto;padding:120px clamp(20px,5vw,80px) 60px}
    @media(max-width:768px){.main-content{margin-left:0;padding:90px 20px 40px}}
    .server-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:56px 24px;background:rgba(13,17,23,.75);border:1px dashed rgba(113,229,220,.18);border-radius:12px}
    .server-empty-icon{width:44px;height:44px;color:#71e5dc;opacity:.55}
    .server-empty-icon svg{width:100%;height:100%}
    .server-empty-title{font-size:17px;font-weight:700;color:#e6edf3}
    .server-empty-desc{font-size:13px;color:#8a939c}
    .server-empty-desc a{color:#71e5dc;text-decoration:none}
    .server-empty-desc a:hover{text-decoration:underline}
    html.light .server-empty{background:rgba(255,255,255,.7);border-color:rgba(10,126,110,.18)}
    html.light .server-empty-title{color:#0f172a}
    html.light .server-empty-desc{color:#64748b}
    html.light .server-empty-icon{color:#0a7e6e}
  </style>
</head>
